<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Return to Spectaculeads</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef7f9; color: #172033; }
      main { width: min(88vw, 420px); box-sizing: border-box; padding: 32px 24px; border-radius: 24px; text-align: center; background: white; box-shadow: 0 18px 50px rgb(18 63 76 / 16%); }
      .mark { width: 52px; height: 52px; margin: 0 auto 16px; display: grid; place-items: center; border-radius: 50%; background: #d9f5ee; color: #087a70; font-size: 28px; font-weight: 800; }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0 0 22px; color: #667085; line-height: 1.5; }
      a { display: block; padding: 13px 18px; border-radius: 12px; color: white; background: #149fb5; font-weight: 700; text-decoration: none; }
      @media (prefers-color-scheme: dark) { body { background: #071216; color: #f2f6f7; } main { background: #101d22; } p { color: #a8b3b8; } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" id="mark">&#10003;</div>
      <h1 id="title">Returning to Spectaculeads</h1>
      <p id="message">Your payment status is being confirmed securely in the app.</p>
      <a id="return-link" href="spectaculeads://checkout/success">Return to app</a>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const status = params.get('status') === 'cancel' ? 'cancel' : 'success';
      const sessionId = params.get('session_id');
      const deepLink = new URL(`spectaculeads://checkout/${status}`);
      if (sessionId) deepLink.searchParams.set('session_id', sessionId);
      const target = deepLink.toString();
      document.getElementById('return-link').href = target;
      if (status === 'cancel') {
        document.getElementById('mark').textContent = '\u00d7';
        document.getElementById('title').textContent = 'Checkout cancelled';
        document.getElementById('message').textContent = 'No payment was taken. Return to the app whenever you are ready.';
      }
      window.location.replace(target);
    </script>
  </body>
</html>
