name: Backend Pytest

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-pytest.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.lock"

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Run functional lint gate
        run: flake8 app tests --select=F,E9 --show-source

  pytest:
    needs: lint
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      REQUIRE_REDIS_RATE_LIMIT_TESTS: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.lock"

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Run pytest
        run: pytest -q

      - name: Run Redis limiter integration tests
        run: pytest -q tests/test_rate_limit_auth.py

  pytest-mysql:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lead_management_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_MYSQL_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/lead_management_test?charset=utf8mb4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.lock"

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Run MySQL webhook concurrency tests
        run: pytest -q -m mysql tests/mysql
